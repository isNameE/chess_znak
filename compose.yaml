services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: arm_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: arm_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - arm_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arm_demo -d arm_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  arm_pg:
