name: Demo checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: arm_demo
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: arm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arm_demo -d arm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://arm_demo:ci-test-only@127.0.0.1:5432/arm_test
      TRUE_API_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest
      - run: node --check static/app.js
      - run: node --check static/plant.js
